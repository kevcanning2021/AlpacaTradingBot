<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alpaca Dashboard</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" href="/static/icons/icon-192.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div id="login-screen" class="screen">
  <form id="login-form">
    <h1>Alpaca Dashboard</h1>
    <input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
    <button type="submit">Log in</button>
    <p id="login-error" class="error"></p>
  </form>
</div>

<div id="app-screen" class="screen hidden">
  <header>
    <div class="tabs" id="account-tabs"></div>
    <button id="logout-btn">Log out</button>
  </header>

  <div id="agents-tab-content" class="hidden">
    <section class="card">
      <h2>Agents <span id="infra-issue-icon"></span></h2>
      <div id="infra-issue-text"></div>
      <div id="agents-overview" class="agents-overview"></div>
    </section>

    <section class="card">
      <button type="button" id="research-agent-toggle" class="section-toggle">Research Agent Decisions ▸</button>
      <div id="research-agent-body" class="hidden">
        <p class="hint">Reviews Main/Sofi/Nova's buy signals and can block one — tap a decision for the full reasoning.</p>
        <button type="button" id="research-agent-filter-toggle" class="filter-toggle">Show all</button>
        <div id="research-agent-list" class="decision-list"></div>
      </div>
    </section>
  </div>

  <div id="account-tab-content">
    <section id="summary-card" class="card"></section>

    <section class="card">
      <h2>Positions</h2>
      <div id="positions-list" class="decision-list"></div>
    </section>

    <section class="card">
      <h2>Recent Orders</h2>
      <div id="orders-list" class="decision-list"></div>
    </section>
  </div>

  <p id="offline-banner" class="hidden">Can't reach the server — showing last known state.</p>
</div>

<script src="/static/app.js"></script>
</body>
</html>
